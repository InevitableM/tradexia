[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradexia-adk"
version = "0.1.0"
description = "Google ADK-powered agent system for stock market analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "requests",
    "httpx",
    "aiohttp",
    "redis",
    "hiredis",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "python-dateutil",
    "pytz",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
